[package]
license = "MIT"
name = "nova-rewards-fuzz"
version = "0.0.1"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

# Stand-alone crate: keep out of the contracts workspace (cargo-fuzz layout).
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
soroban-sdk = { version = "27.0.0", features = ["testutils"] }
nova-rewards = { path = "../nova-rewards", optional = true }
nova_token = { path = "../nova_token", optional = true }
distribution = { path = "../distribution", optional = true }
reward_pool = { path = "../reward_pool", optional = true }
vesting = { path = "../vesting" }
referral = { path = "../referral" }

[features]
# The distribution contract does not parse on main (mangled merge in
# contracts/distribution/src/lib.rs), nova-rewards fails to build with the
# soroban-sdk "testutils" feature enabled, and reward_pool has duplicated
# `get_balance` definitions plus a dangling code fragment left over from a
# bad merge (tracked in #1225). Until those crates are repaired, their fuzz
# targets are gated behind this feature so the remaining targets stay
# buildable: cargo fuzz run <target> --features broken-contracts
broken-contracts = ["dep:nova-rewards", "dep:nova_token", "dep:distribution", "dep:reward_pool"]

[[bin]]
name = "fuzz_calculate_payout"
path = "fuzz_targets/fuzz_calculate_payout.rs"
test = false
doc = false
required-features = ["broken-contracts"]

[[bin]]
name = "fuzz_staking"
path = "fuzz_targets/fuzz_staking.rs"
test = false
doc = false
required-features = ["broken-contracts"]

[[bin]]
name = "fuzz_vesting"
path = "fuzz_targets/fuzz_vesting.rs"
test = false
doc = false

[[bin]]
name = "fuzz_referral"
path = "fuzz_targets/fuzz_referral.rs"
test = false
doc = false

[[bin]]
name = "fuzz_reward_pool"
path = "fuzz_targets/fuzz_reward_pool.rs"
test = false
doc = false
required-features = ["broken-contracts"]

[[bin]]
name = "fuzz_token_transfer"
path = "fuzz_targets/fuzz_token_transfer.rs"
test = false
doc = false
required-features = ["broken-contracts"]

[[bin]]
name = "fuzz_reward_distribution"
path = "fuzz_targets/fuzz_reward_distribution.rs"
test = false
doc = false
required-features = ["broken-contracts"]
